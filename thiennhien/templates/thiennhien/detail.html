{% load static %}
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chi tiết bài viết - Khám phá thiên nhiên</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'thiennhien/css/style.css' %}">
</head>

<body>

<div class="detail-container">

    <img src="{% static article.image %}" class="detail-image">

    <h1>{{ article.title }}</h1>

    <p>
        {{ article.content }}
    </p>

    <h2>🌿 Tìm hiểu thêm</h2>

    <p>
        Thiên nhiên luôn mang đến những điều kỳ thú và đáng để khám phá.
        Việc tìm hiểu và bảo vệ môi trường tự nhiên là trách nhiệm của
        tất cả chúng ta.
    </p>

    <a href="/" class="back-button">
        ← Quay về trang chủ
    </a>

</div>

</body>
</html>
